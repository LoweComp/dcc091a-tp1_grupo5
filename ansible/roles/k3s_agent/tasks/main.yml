- name: Instalar K3s Worker e ingressar no cluster
  shell: |
    curl -sfL https://get.k3s.io | K3S_URL=https://192.168.56.20:6443 K3S_TOKEN="{{ hostvars['k3s-server']['k3s_token'] }}" INSTALL_K3S_EXEC="agent --node-ip 192.168.56.30" sh -
  args:
    executable: /bin/bash
  when: not ansible_check_mode