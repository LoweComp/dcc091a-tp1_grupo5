---
- name: Instalar Nginx e Keepalived
  apt:
    name: 
      - nginx
      - keepalived
    state: present
    update_cache: yes

- name: Configurar o Proxy Reverso Nginx para o cluster K3s
  copy:
    content: |
      upstream k3s_cluster {
          server 192.168.56.20;
          server 192.168.56.30;
      }
      server {
          listen 80;
          location / {
              proxy_pass http://k3s_cluster;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
          }
      }
    dest: /etc/nginx/sites-available/default

- name: Configurar Keepalived (Alta Disponibilidade)
  copy:
    content: |
      vrrp_instance VI_1 {
          state {{ 'MASTER' if inventory_hostname == 'bastion' else 'BACKUP' }}
          interface enp0s8
          virtual_router_id 51
          priority {{ 100 if inventory_hostname == 'bastion' else 90 }}
          advert_int 1
          authentication {
              auth_type PASS
              auth_pass senha_tp2
          }
          virtual_ipaddress {
              192.168.56.254/24
          }
      }
    dest: /etc/keepalived/keepalived.conf

- name: Habilitar IP Forwarding no kernel
  sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    sysctl_set: yes
    state: present
    reload: yes

- name: Permitir roteamento (FORWARD) na firewall UFW
  lineinfile:
    path: /etc/default/ufw
    regexp: '^DEFAULT_FORWARD_POLICY='
    line: 'DEFAULT_FORWARD_POLICY="ACCEPT"'

- name: Configurar Masquerade (NAT) para saida de internet
  iptables:
    table: nat
    chain: POSTROUTING
    out_interface: enp0s3
    jump: MASQUERADE

- name: Reiniciar e ativar servicos essenciais
  service:
    name: "{{ item }}"
    state: restarted
    enabled: yes
  loop:
    - nginx
    - keepalived
    - ufw