---
- name: Instalar K3s Master
  shell: curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="server --node-ip 192.168.56.20 --bind-address 192.168.56.20" sh -
  args:
    creates: /usr/local/bin/k3s

- name: Aguardar a geracao do token do cluster
  wait_for:
    path: /var/lib/rancher/k3s/server/node-token

- name: Ler o token gerado
  command: cat /var/lib/rancher/k3s/server/node-token
  register: k3s_token_output
  changed_when: false

- name: Guardar o token na memoria do Ansible para os workers
  set_fact:
    k3s_token: "{{ k3s_token_output.stdout }}"