---
# Master & Workers funcionando com k3s
- name: Forjar o Control Plane (Master)
  hosts: master
  become: yes
  tasks:
    - name: Instalar K3s no nó Master
      shell: curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Capturar o token de segurança do Master
      command: cat /var/lib/rancher/k3s/server/node-token
      register: k3s_token
      changed_when: false

    - name: Armazenar o token em memória (Fact) para usar nos Workers
      set_fact:
        token: "{{ k3s_token.stdout }}"

- name: Materializar os Workers e juntar ao Cluster
  hosts: worker1, worker2
  become: yes
  tasks:
    - name: Instalar K3s Agent e conectar ao Master
      shell: >
        curl -sfL https://get.k3s.io | 
        K3S_URL=https://192.168.56.20:6443 
        K3S_TOKEN={{ hostvars['master']['token'] }} sh -
      args:
        creates: /usr/local/bin/k3s-agent