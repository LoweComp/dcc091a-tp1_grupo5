---
# 1. DB: Servidor de Log e Persistência
- hosts: db
  become: yes
  tasks:
    - name: Garantir diretorio persistente para os logs
      file:
        path: /var/lib/dados_persistentes/logs_remotos
        state: directory
        mode: '0755'

    - name: Permitir trafego Rsyslog na firewall (Porta 514 UDP)
      ufw:
        rule: allow
        port: '514'
        proto: udp

    - name: Ativar rececao de logs e garantir persistencia
      blockinfile:
        path: /etc/rsyslog.conf
        marker: "# {mark} ANSIBLE MANAGED BLOCK - RSYSLOG SERVER"
        block: |
          module(load="imudp")
          input(type="imudp" port="514")
          $template RemoteLogs,"/var/lib/dados_persistentes/logs_remotos/%HOSTNAME%/%PROGRAMNAME%.log"
          *.* ?RemoteLogs
      notify: Reiniciar Rsyslog

  handlers:
    - name: Reiniciar Rsyslog
      service:
        name: rsyslog
        state: restarted

- hosts: all
  become: yes
  tasks:
    - name: Garantir que o SSH rejeite autenticacao por senha
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication no'
      notify: Reiniciar SSH

    - name: Bloquear login direto do root via SSH
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin no'
      notify: Reiniciar SSH

    - name: Garantir que o UFW esta instalado
      apt:
        name: ufw
        state: present
        update_cache: yes

    - name: Permitir conexoes SSH (Porta 22)
      ufw:
        rule: allow
        port: '22'
        proto: tcp

    - name: Permitir HTTP (Porta 80)
      ufw:
        rule: allow
        port: '80'
        proto: tcp

    - name: Permitir HTTPS (Porta 443)
      ufw:
        rule: allow
        port: '443'
        proto: tcp

    - name: Ativar o UFW e definir politica padrao (Nega IN, Permite OUT)
      ufw:
        state: enabled
        direction: incoming
        policy: deny

  handlers:
    - name: Reiniciar SSH
      service:
        name: ssh
        state: restarted

# 2. Clientes de Log
- hosts: bastion, webservers
  become: yes
  tasks:
    - name: Enviar logs para o servidor DB
      lineinfile:
        path: /etc/rsyslog.d/50-default.conf
        line: "*.* @192.168.56.20:514"
        insertafter: EOF
      notify: Reiniciar Rsyslog

  handlers:
    - name: Reiniciar Rsyslog
      service:
        name: rsyslog
        state: restarted

- hosts: webservers
  become: yes
  tasks:
    - name: Instalar o Nginx
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Garantir que o Nginx esta ativo e habilitado no boot
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Criar pagina HTML personalizada identificando o no (para testes)
      copy:
        content: "<h1>Bem-vindo ao {{ inventory_hostname }} - LOWE</h1>"
        dest: /var/www/html/index.html

- hosts: bastion
  become: yes
  tasks:
    - name: Instalar Nginx no Bastion (Proxy Reverso)
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Configurar o Proxy Reverso para o Cluster Web
      copy:
        content: |
          upstream web_cluster {
              server 192.168.56.11;
              server 192.168.56.12;
          }
          server {
              listen 80;
              location / {
                  proxy_pass http://web_cluster;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
              }
          }
        dest: /etc/nginx/sites-available/default
      notify: Reiniciar Nginx no Bastion

  handlers:
    - name: Reiniciar Nginx no Bastion
      service:
        name: nginx
        state: restarted               
