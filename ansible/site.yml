---
- name: Aplicar configuracoes base em todas as maquinas
  hosts: all
  become: yes
  roles:
    - common

- name: Configurar Proxy Reverso e Alta Disponibilidade
  hosts: proxy
  become: yes
  roles:
    - proxy_ha

- name: Configurar o K3s Master
  hosts: master
  become: yes
  roles:
    - k3s_server

- name: Configurar o K3s Worker
  hosts: workers
  become: yes
  roles:
    - k3s_agent